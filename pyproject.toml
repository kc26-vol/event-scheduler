requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "pydantic==2.9.2",
    "python-multipart",
    "openpyxl",
    "Pillow",
    "gunicorn",
    "httpx",
]

[tool.uv]
package = false
