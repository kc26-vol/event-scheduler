name: Deploy

# main への push で staging、Release の公開で本番へデプロイする。
#
# 認証は発行プロファイル (長期シークレット) を使う。
# OIDC (Workload Identity Federation) への移行は別タスク。移行時は
# .github/workflows/README.md の「OIDC への移行」を参照。
#
# このリポジトリは public のため、フォークからの PR で実行されない
# トリガー (push / release / workflow_dispatch) のみを使っている。
# GitHub の Secrets はフォークからの PR には渡らない。

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "infra/**"
      - ".github/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: デプロイ先
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  # 同じ環境への同時デプロイを防ぐ。実行中のデプロイは中断しない。
  group: deploy-${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.t.outputs.environment }}
      app_name: ${{ steps.t.outputs.app_name }}
    steps:
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TARGET=production
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          else
            TARGET=staging
          fi
          {
            echo "environment=$TARGET"
            if [ "$TARGET" = "production" ]; then
              echo "app_name=${{ vars.AZURE_WEBAPP_NAME_PROD }}"
            else
              echo "app_name=${{ vars.AZURE_WEBAPP_NAME_STAGING }}"
            fi
          } >> "$GITHUB_OUTPUT"
          echo "デプロイ先: $TARGET"

  deploy:
    needs: setup
    runs-on: ubuntu-latest
    # 環境に承認ゲートやレビュアーを設定できる (本番は必須にすることを推奨)
    environment:
      name: ${{ needs.setup.outputs.environment }}
      url: https://${{ needs.setup.outputs.app_name }}.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # バックエンドは frontend/dist を静的配信する。
      # Oryx の Python ビルドは Node を実行しないため、ここで必ずビルドしておく。
      - name: フロントエンドをビルド
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: デプロイパッケージを作成
        run: |
          set -euo pipefail
          # .env* を必ず除外する (シークレットをデプロイ物に含めない)。
          # data/ 等は wwwroot 配下に置かない運用なので同梱しない。
          # .venv/ .deploy/ は CI には無いが、同じコマンドをローカルで
          # 検証できるように除外しておく (無いと 100MB 超になる)。
          zip -r -q deploy.zip . \
            -x ".git/*" ".github/*" "infra/*" \
               "*/node_modules/*" "node_modules/*" \
               ".venv/*" "venv/*" ".deploy/*" ".idea/*" \
               "*__pycache__/*" "*.pyc" ".pytest_cache/*" \
               "data/*" "backups/*" "public_snapshots/*" "uploads/*" \
               "*.db" ".env*" "*.tfstate*" "deploy.zip"

      # パッケージが壊れていないかを、デプロイ前に検証する
      - name: パッケージを検証
        run: |
          set -euo pipefail
          unzip -l deploy.zip | grep -q 'frontend/dist/assets/' \
            || { echo "::error::frontend/dist がパッケージに含まれていません"; exit 1; }
          unzip -l deploy.zip | grep -q 'requirements.txt' \
            || { echo "::error::requirements.txt がありません (Oryx が依存を入れられません)"; exit 1; }
          if unzip -l deploy.zip | grep -q '\.env'; then
            echo "::error::.env がパッケージに混入しています"; exit 1
          fi
          echo "パッケージ検証 OK ($(du -h deploy.zip | cut -f1))"

      # zip デプロイは wwwroot を丸ごと置き換える。実データが wwwroot 配下に
      # あるとデプロイで消えるため、DATA_DIR が永続領域を指すことを確認する。
      # 発行プロファイル方式では az が使えないので Kudu の API から読む。
      - name: DATA_DIR が永続領域を指しているか検証
        env:
          PUBLISH_PROFILE: ${{ needs.setup.outputs.environment == 'production' && secrets.AZURE_PUBLISH_PROFILE_PROD || secrets.AZURE_PUBLISH_PROFILE_STAGING }}
          APP_NAME: ${{ needs.setup.outputs.app_name }}
        run: |
          set -euo pipefail
          # 発行プロファイル(XML)から SCM の資格情報を取り出す
          CREDS=$(python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          for p in root.iter("publishProfile"):
              if p.get("publishMethod") == "MSDeploy":
                  print(f'{p.get("userName")}\t{p.get("userPWD")}')
                  sys.exit(0)
          sys.exit("MSDeploy プロファイルが見つかりません")
          PY
          )
          USER="${CREDS%%$'\t'*}"; PASS="${CREDS#*$'\t'}"
          # ログに出さない
          echo "::add-mask::$PASS"
          echo "::add-mask::$USER"

          D=$(curl -sf -u "$USER:$PASS" --max-time 60 \
                "https://${APP_NAME}.scm.azurewebsites.net/api/settings" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("DATA_DIR",""))')
          if [ -z "$D" ]; then
            echo "::error::DATA_DIR が未設定です。DB が wwwroot 配下に作られ、デプロイで消えます"; exit 1
          fi
          case "$D" in
            /home/site/wwwroot*) echo "::error::DATA_DIR ($D) が wwwroot 配下です。デプロイで消えます"; exit 1 ;;
            /home/*) echo "OK: DATA_DIR=$D" ;;
            *) echo "::error::DATA_DIR ($D) が永続領域 (/home 配下) ではありません"; exit 1 ;;
          esac

      - name: デプロイ
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.setup.outputs.app_name }}
          publish-profile: ${{ needs.setup.outputs.environment == 'production' && secrets.AZURE_PUBLISH_PROFILE_PROD || secrets.AZURE_PUBLISH_PROFILE_STAGING }}
          package: deploy.zip

      # 起動失敗 (例: /home のマウント未完了) を検知する。
      # アプリは認証必須なので、認証不要な login.html で判定する。
      - name: 起動を確認
        run: |
          set -euo pipefail
          URL="https://${{ needs.setup.outputs.app_name }}.azurewebsites.net/login.html"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "起動を確認しました (HTTP 200)"; exit 0
            fi
            echo "待機中... ($i/30, HTTP $CODE)"
            sleep 10
          done
          echo "::error::アプリが応答しません。起動時のログを確認してください"
          exit 1

      - name: デプロイ結果
        run: |
          {
            echo "### デプロイ完了 :rocket:"
            echo ""
            echo "- 環境: \`${{ needs.setup.outputs.environment }}\`"
            echo "- URL: https://${{ needs.setup.outputs.app_name }}.azurewebsites.net"
            echo "- コミット: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
