name: Deploy to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/deploy.yml
      - .github/workflows/workers-ci.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare deployment environment
        type: choice
        required: true
        default: staging
        options: [staging, production]

permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/workers-ci.yml
    with:
      package: true
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
      url: ${{ steps.prepare.outputs.url }}
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: worker-bundle
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/worker-bundle.tgz"
      - name: Prepare Worker secrets
        env:
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          const secrets = {};
          if (Boolean(process.env.LINE_CHANNEL_ID) !== Boolean(process.env.LINE_CHANNEL_SECRET))
            throw Error("Set LINE_CHANNEL_ID and LINE_CHANNEL_SECRET together to enable LINE.");
          if (process.env.LINE_CHANNEL_SECRET) secrets.LINE_CHANNEL_SECRET = process.env.LINE_CHANNEL_SECRET;
          writeFileSync(process.env.RUNNER_TEMP + "/worker-secrets.json", JSON.stringify(secrets), {mode:0o600});
          JS
      - name: Resolve D1 and R2 on the target account
        id: prepare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
        run: node scripts/prepare-cloudflare.mjs "$TARGET"
      - name: Apply migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.deploy.json
      - name: Seed the first administrator on an empty database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
        run: node scripts/seed-admin.mjs --remote
      - name: Publish Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPEN_NEXT_DEPLOY: "true"
        run: npx --no-install wrangler deploy --config wrangler.deploy.json --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Verify deployed Worker and database
        env:
          WORKER_URL: ${{ steps.prepare.outputs.url }}
        run: |
          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors "$WORKER_URL/api/health" | jq -e '.status == "ok"'
      - if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
