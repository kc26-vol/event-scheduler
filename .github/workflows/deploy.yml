name: Deploy to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/deploy.yml
      - .github/workflows/workers-ci.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare deployment environment
        type: choice
        required: true
        default: staging
        options: [staging, production]

permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/workers-ci.yml
    with:
      package: true
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
      url: ${{ steps.prepare.outputs.url }}
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: worker-bundle
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/worker-bundle.tgz"
      - name: Prepare Worker secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          const secrets = {};
          for (const key of ["SESSION_SECRET", "SETUP_TOKEN"]) {
            if (!process.env[key]) throw Error("Set environment secret " + key);
            secrets[key] = process.env[key];
          }
          writeFileSync(process.env.RUNNER_TEMP + "/worker-secrets.json", JSON.stringify(secrets), {mode:0o600});
          JS
      - name: Resolve D1 and R2 on the target account
        id: prepare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET: ${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
        run: node scripts/prepare-cloudflare.mjs "$TARGET"
      - name: Apply migrations and publish
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPEN_NEXT_DEPLOY: "true"
        run: |
          npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.deploy.json
          npx --no-install wrangler deploy --config wrangler.deploy.json --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Verify deployed Worker and database
        env:
          WORKER_URL: ${{ steps.prepare.outputs.url }}
        run: |
          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors "$WORKER_URL/api/health" | jq -e '.status == "ok"'
      - if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
